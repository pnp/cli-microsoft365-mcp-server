name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version in package.json and package-lock.json
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Bump version in server.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const file = 'server.json';
            const content = fs.readFileSync(file, 'utf8');
            const server = JSON.parse(content);
            server.version = process.env.VERSION;
            for (const pkg of server.packages ?? []) {
              if (pkg.identifier === '@pnp/cli-microsoft365-mcp-server') {
                pkg.version = process.env.VERSION;
              }
            }
            fs.writeFileSync(file, JSON.stringify(server, null, 2) + (content.endsWith('\n') ? '\n' : ''));
          "

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          BRANCH="release/v$VERSION"
          TITLE="Releases v$VERSION"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists on origin"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add package.json package-lock.json server.json
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## 🎯 Aim

          Release v$VERSION (\`$BUMP\` bump).

          ## ✅ What was done

          - [X] bumped version to \`$VERSION\` in \`package.json\`, \`package-lock.json\` and \`server.json\`
          - [X] built the MCP server (\`npm run build\`)
          - [X] ran tests (\`npm test\`)
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md"
